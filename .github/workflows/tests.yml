name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install core dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run core tests
        run: python -m pytest

      - name: Validate Runtime Output Contracts
        run: python -m autotem.validation.runtime_contract

      - name: Run lint
        run: python -m ruff check .

  test-io:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install IO dependencies
        run: python -m pip install -e ".[dev,io]"

      - name: Run IO tests
        run: python -m pytest tests/test_io.py
