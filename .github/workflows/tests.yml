name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install core dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run core tests
        run: python -m pytest

      - name: Validate Runtime Output Contracts
        run: python -m autotem.validation.runtime_contract

      - name: Run A4 Benchmark Smoke Gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np

          root = Path("ci_benchmark_smoke")
          root.mkdir(parents=True, exist_ok=True)
          input_path = root / "input.npy"
          image = np.zeros((48, 48), dtype=np.float32)
          image[24, 16] = 8.0
          image[24, 32] = 8.0
          np.save(input_path, image)

          suite_path = root / "suite.yaml"
          suite_path.write_text(
              "\n".join(
                  [
                      "suite:",
                      "  suite_id: ci_smoke",
                      "cases:",
                      "  - case_id: ci_case_01",
                      "    input_path: input.npy",
                      "    workflow_path: ../configs/default.yaml",
                      "    acceptance_criteria:",
                      "      - metric: workflow_no_failed_steps",
                      "        op: \">=\"",
                      "        threshold: 1",
                  ]
              ),
              encoding="utf-8",
          )
          PY
          autotem benchmark --suite ci_benchmark_smoke/suite.yaml --output ci_benchmark_smoke/out --fail-on-failed

      - name: Run lint
        run: python -m ruff check .

  test-io:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install IO dependencies
        run: python -m pip install -e ".[dev,io]"

      - name: Run IO tests
        run: python -m pytest -o addopts="-q" tests/test_io.py

  test-streamlit-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up deployment Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/requirements.txt

      - name: Install the deployment requirements
        run: |
          python -m pip install -r apps/requirements.txt pytest wheel
          python -m pip check
          python - <<'PY'
          import sys
          from importlib.metadata import version

          assert sys.version_info[:2] == (3, 12), sys.version
          assert version("streamlit") == "1.57.0"
          assert version("streamlit-drawable-canvas") == "0.9.3"
          PY

      - name: Run upload and app integration tests without the default smoke filter
        run: >-
          python -m pytest -o addopts="-q"
          tests/test_upload_lifecycle.py tests/test_atom_detection.py tests/test_streamlit_deployment.py
          -k "not installed_wheel"

      - name: Replace the editable package with its deployment wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/autotem-wheel" .
          python -m pip uninstall -y autotem-insight
          python -m pip install --no-deps "$RUNNER_TEMP"/autotem-wheel/autotem_insight-*.whl
          python -m pip check

      - name: Start the original entrypoint outside the repository using the installed wheel
        env:
          AUTOTEM_DEPLOYMENT_WHEEL: "1"
        run: >-
          python -m pytest -o addopts="-q"
          tests/test_streamlit_deployment.py -k installed_wheel
