name: nightly-benchmark

"on":
  schedule:
    # 02:00 UTC daily (10:00 Asia/Shanghai)
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  benchmark-public-minimal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run nightly benchmark suite
        run: |
          python -m autotem.cli benchmark \
            --suite benchmarks/suite_public_minimal.yaml \
            --output outputs/benchmark-public-minimal-nightly \
            --fail-on-failed

      - name: Upload benchmark trend/report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-benchmark-public-minimal-${{ github.run_id }}
          path: |
            outputs/benchmark-public-minimal-nightly/benchmark_suite_report.json
            outputs/benchmark-public-minimal-nightly/benchmark_suite_report.html
            outputs/benchmark-public-minimal-nightly/benchmark_suite_history.jsonl
            outputs/benchmark-public-minimal-nightly/benchmark_suite_trend.json
            outputs/benchmark-public-minimal-nightly/benchmark_suite_trend.html
            outputs/benchmark-public-minimal-nightly/cases/**/benchmark_report.json
          if-no-files-found: error

      - name: Build nightly benchmark summary
        if: always()
        id: benchmark_summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          out_dir = Path("outputs/benchmark-public-minimal-nightly")
          trend_path = out_dir / "benchmark_suite_trend.json"
          suite_report_path = out_dir / "benchmark_suite_report.json"
          issue_body_path = out_dir / "nightly_regression_issue.md"

          run_url = (
              f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/"
              f"{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/"
              f"{os.environ.get('GITHUB_RUN_ID', '')}"
          )

          alerts = []
          suite_id = "unknown_suite"
          history_count = 0
          if trend_path.exists():
              trend = json.loads(trend_path.read_text(encoding="utf-8"))
              suite_id = str(trend.get("suite_id", suite_id))
              history_count = int(trend.get("history_count", 0))
              payload = trend.get("regression_alerts", [])
              if isinstance(payload, list):
                  alerts = [item for item in payload if isinstance(item, dict)]

          count = len(alerts)
          top = alerts[:3]

          summary_lines = [
              "## Nightly Benchmark Summary",
              "",
              f"- Suite: `{suite_id}`",
              f"- Regression alerts: `{count}`",
              f"- History count: `{history_count}`",
              f"- Workflow run: {run_url}",
              "",
          ]
          if top:
              summary_lines.extend(
                  [
                      "### Top Regressions",
                      "",
                      "| Case | Severity | Weight Source | Reasons |",
                      "|---|---:|---|---|",
                  ]
              )
              for item in top:
                  case_id = str(item.get("case_id", ""))
                  severity = int(item.get("severity", 0))
                  weight_source = str(item.get("weight_source", "suite_default"))
                  reasons = item.get("reasons", [])
                  if isinstance(reasons, list):
                      reason_text = "; ".join(str(row) for row in reasons)
                  else:
                      reason_text = ""
                  reason_text = reason_text.replace("\n", " ")
                  summary_lines.append(
                      f"| `{case_id}` | {severity} | `{weight_source}` | {reason_text} |"
                  )
              summary_lines.append("")
          else:
              summary_lines.extend(["No regressions detected.", ""])

          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(summary_lines) + "\n",
              encoding="utf-8",
          )

          issue_lines = [
              "# Nightly Benchmark Regression Alert",
              "",
              f"- Suite: `{suite_id}`",
              f"- Run: {run_url}",
              f"- Regression alerts: `{count}`",
              "",
              "## Top Regressions",
              "",
          ]
          if top:
              for item in top:
                  case_id = str(item.get("case_id", ""))
                  severity = int(item.get("severity", 0))
                  weight_source = str(item.get("weight_source", "suite_default"))
                  reasons = item.get("reasons", [])
                  if isinstance(reasons, list):
                      reason_text = "; ".join(str(row) for row in reasons)
                  else:
                      reason_text = ""
                  issue_lines.append(
                      f"- `{case_id}` severity={severity}, source=`{weight_source}`"
                  )
                  issue_lines.append(f"  - reasons: {reason_text}")
          else:
              issue_lines.append("- none")
          issue_lines.extend(
              [
                  "",
                  "## Artifacts",
                  "",
                  "- `benchmark_suite_report.json/html`",
                  "- `benchmark_suite_trend.json/html`",
                  "- `benchmark_suite_history.jsonl`",
                  "",
                  "_This issue is managed by `.github/workflows/nightly-benchmark.yml`._",
              ]
          )
          issue_body_path.parent.mkdir(parents=True, exist_ok=True)
          issue_body_path.write_text("\n".join(issue_lines) + "\n", encoding="utf-8")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"regression_alert_count={count}\n")
              handle.write(f"suite_id={suite_id}\n")
              handle.write(f"issue_body_path={issue_body_path.as_posix()}\n")
          PY

      - name: Create or update regression issue
        if: always() && steps.benchmark_summary.outputs.regression_alert_count != '0'
        uses: actions/github-script@v7
        env:
          SUITE_ID: ${{ steps.benchmark_summary.outputs.suite_id }}
          REGRESSION_ALERT_COUNT: ${{ steps.benchmark_summary.outputs.regression_alert_count }}
          ISSUE_BODY_PATH: ${{ steps.benchmark_summary.outputs.issue_body_path }}
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `[Nightly Benchmark] Regressions detected (${process.env.SUITE_ID})`;
            const body = fs.readFileSync(process.env.ISSUE_BODY_PATH, "utf8");

            const list = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = list.data.find((item) => item.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Nightly run \`${context.runId}\` reported ${process.env.REGRESSION_ALERT_COUNT} regression alert(s).`,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
            }

      - name: Resolve previous regression issue when clean
        if: always() && steps.benchmark_summary.outputs.regression_alert_count == '0'
        uses: actions/github-script@v7
        env:
          SUITE_ID: ${{ steps.benchmark_summary.outputs.suite_id }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `[Nightly Benchmark] Regressions detected (${process.env.SUITE_ID})`;

            const list = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = list.data.find((item) => item.title === title);
            if (!existing) {
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: existing.number,
              body: `Nightly run \`${context.runId}\` detected no regressions. Closing this alert issue.`,
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: existing.number,
              state: "closed",
              state_reason: "completed",
            });
