[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autotem-insight"
version = "0.1.0"
description = "Reusable TEM data-analysis workflows for structure insight."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "AutoTEM-Insight Contributors" }
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "scipy>=1.10",
  "scikit-image>=0.25",
  "matplotlib>=3.8",
  "imageio>=2.34",
  "tifffile>=2024.5.22",
  "ncempy>=1.15"
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.7",
  "pytest>=8.0",
  "ruff>=0.5"
]
ui = [
  "streamlit>=1.57",
  "streamlit-drawable-canvas>=0.9.3"
]
mcp = [
  "mcp>=1.27,<2",
  "tomli>=2.0; python_version < '3.11'"
]
io = [
  "h5py>=3.10",
  "mrcfile>=1.4",
  "ncempy>=1.12"
]
crystallography = [
  "mp-api>=0.41",
  "pymatgen>=2024.5"
]
simulation = [
  "diffsims>=0.7"
]
gpl_adapters = [
  "diffsims>=0.7",
  "diffpy.structure>=3.0",
  "orix>=0.13",
  "py4DSTEM>=0.14.14",
  "pyxem>=0.21.0"
]

[project.scripts]
autotem = "autotem.cli:main"
autotem-harness = "autotem.harness.cli:main"

[tool.setuptools.packages.find]
include = ["autotem*"]

[tool.setuptools.package-data]
"autotem.harness" = [
  "resources/skill/*.md",
  "resources/skill/agents/*.yaml",
  "resources/skill/references/*.md",
  "resources/skill/references/profiles/*.yaml",
  "resources/skill/references/recipes/*.yaml",
  "resources/skill/references/hosts/codex/*.toml"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m smoke"
markers = [
  "smoke: minimal runnable smoke tests for the current main-branch scope",
  "real_diffsims: opt-in tests that execute the real diffsims/orix simulation stack"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
