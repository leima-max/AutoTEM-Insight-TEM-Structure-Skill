[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autotem-insight"
version = "0.1.0"
description = "Reusable TEM data-analysis workflows for structure insight."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "AutoTEM-Insight Contributors" }
]
dependencies = [
  "numpy>=1.24",
  "pydantic>=2.0",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5"
]

[project.scripts]
autotem = "autotem.cli:main"

[tool.setuptools.packages.find]
include = ["autotem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
