workflow:
  name: diffsims_closed_loop_example
  description: Synthetic B3->B4->B5 diffraction loop with a real diffsims adapter.
  steps:
    - load
    - assess_quality
    - calibrate
    - preprocess
    - analyze
    - simulate
    - report
  parameters:
    calibration:
      method: reference
      known_d_spacing: 0.4
      known_d_spacing_unit: nm
      measured_radius_px: 10
    preprocessing:
      recipe: min_max
      background_method: none
    diffraction:
      top_k_peaks: 12
      min_peak_distance: 3
      center_exclusion_radius: 4
      peak_threshold_strategy: relative_max
      peak_threshold_value: 0.12
      phase_candidate_materials: [cubic_probe]
      candidate_phase_params:
        - name: cubic_probe
          formula: X
          a: 0.4
          b: 0.4
          c: 0.4
          alpha: 90
          beta: 90
          gamma: 90
          space_group: Pm-3m
          space_group_number: 221
          atom_sites:
            - element: Si
              abc: [0, 0, 0]
              occupancy: 1.0
      indexing_mode: lattice_fit
      phase_top_n: 1
      max_hkl: 3
      d_tolerance_rel: 0.08
      angle_tolerance_deg: 10.0
    simulation:
      simulation_engine: diffsims
      voltage_kv: 200
      reciprocal_radius_inv_angstrom: 1.5
      zone_axis_candidates:
        - [0, 0, 1]
        - [1, 1, 0]
        - [1, 1, 1]
      rotation_axis: [0, 0, 1]
      rotation_angles_deg: [0]
      max_simulated_spots: 128
      minimum_simulated_g_inv_nm: 0.001
      phase_match_enabled: true
      phase_match_d_tolerance_rel: 0.03
      phase_match_angle_tolerance_deg: 3.0
      phase_match_min_spots: 3
      phase_match_previous_score_weight: 0.0
      pattern_shape: [64, 64]
outputs:
  formats: [json, csv, html]
  save_intermediates: true
