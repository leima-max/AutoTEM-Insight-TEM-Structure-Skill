suite:
  schema_version: 2026-05-13.a4.case-schema.v1
  suite_id: public_minimal_suite
  description: Public minimal benchmark package after requested task cleanup.
  default_output_dir: outputs/benchmark-public-minimal
  regression_weights:
    status_flip_pass_to_fail: 5
    acceptance_failed_increase: 2
    warning_count_increase: 1
    acceptance_pass_rate_drop: 2
  regression_weight_templates:
    - modality: HAADF-STEM
      weights:
        warning_count_increase: 0

cases:
  - case_id: b_diffraction_public
    description: Public B-side fixture for diffraction, d-spacing, hkl, and phase metrics.
    modality: HRTEM
    report_path: cases/b_diffraction_public/analysis_report.json
    tags: [public, minimal, b, diffraction, b4]
    reference:
      d_spacings_nm: [0.4, 0.4, 0.2828427125]
      hkl_truth:
        - [1, 0, 0]
        - [0, 1, 0]
        - [1, 1, 0]
      hkl_top_k: 3
      phase_truth: [cubic_probe]
      phase_top_k: 1
    acceptance_criteria:
      - metric: workflow_no_failed_steps
        op: ">="
        threshold: 1
      - metric: diffraction_peak_count
        op: ">="
        threshold: 3
      - metric: d_spacing_mean_relative_error
        op: "<="
        threshold: 0.001
      - metric: hkl_topk_accuracy
        op: ">="
        threshold: 1
      - metric: phase_topk_accuracy
        op: ">="
        threshold: 1
      - metric: b3_b4_indexed_nonzero_fraction
        op: ">="
        threshold: 1
      - metric: b_interface_pass_rate
        op: ">="
        threshold: 1
  - case_id: b5_diffsims_phase_matching_public
    description: Public B5 fixture for simulated diffraction and phase matching metrics.
    modality: HRTEM
    report_path: cases/b5_diffsims_phase_matching_public/analysis_report.json
    tags: [public, minimal, b, b5, diffsims, phase_matching, simulation]
    reference:
      b5_phase_truth: [cubic_probe]
      b5_phase_top_k: 1
    acceptance_criteria:
      - metric: workflow_no_failed_steps
        op: ">="
        threshold: 1
      - metric: b_interface_pass_rate
        op: ">="
        threshold: 1
      - metric: b5_phase_matching_active_flag
        op: ">="
        threshold: 1
      - metric: b5_simulation_pattern_count
        op: ">="
        threshold: 1
      - metric: b5_simulated_spot_count
        op: ">="
        threshold: 4
      - metric: b5_matched_phase_candidate_count
        op: ">="
        threshold: 1
      - metric: b5_best_matched_spot_count
        op: ">="
        threshold: 3
      - metric: b5_best_phase_match_score
        op: ">="
        threshold: 0.9
      - metric: b5_best_mean_d_error
        op: "<="
        threshold: 0.01
      - metric: b5_best_mean_angle_error_deg
        op: "<="
        threshold: 1.0
      - metric: b5_phase_topk_accuracy
        op: ">="
        threshold: 1
      - metric: b5_simulation_overlay_count
        op: ">="
        threshold: 1
  - case_id: c_atomic_strain_public
    description: Public C-side fixture for atom-coordinate and strain benchmark metrics.
    modality: HAADF-STEM
    report_path: cases/c_atomic_strain_public/analysis_report.json
    tags: [public, minimal, c, atomic, strain]
    reference:
      atom_coordinates:
        - [10.0, 10.0]
        - [14.0, 10.0]
        - [12.0, 13.464]
      atom_nearest_distances: [4.0, 4.0, 3.999912]
      strain_maps:
        strain_xx:
          values:
            - [0.10, 0.20]
            - [0.30, 0.40]
    acceptance_criteria:
      - metric: workflow_no_failed_steps
        op: ">="
        threshold: 1
      - metric: atom_coordinate_rmse
        op: "<="
        threshold: 0.01
      - metric: atom_nearest_distance_mean_relative_error
        op: "<="
        threshold: 0.02
      - metric: strain_xx_mae
        op: "<="
        threshold: 0.001
      - metric: c_interface_pass_rate
        op: ">="
        threshold: 1
